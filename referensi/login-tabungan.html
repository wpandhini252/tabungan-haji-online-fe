<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>

<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.querySelector('form');
            const submitBtn = loginForm.querySelector('button[type="submit"]');

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                submitBtn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Memproses...</span>
                `;
                
                // Simulate delay
                setTimeout(() => {
                    submitBtn.innerHTML = `
                        <span class="material-symbols-outlined">check_circle</span>
                        <span>Berhasil</span>
                    `;
                    submitBtn.classList.replace('bg-primary', 'bg-primary-container');
                    submitBtn.classList.replace('text-white', 'text-on-primary-container');
                }, 1500);
            });

            // Password toggle
            const togglePass = loginForm.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            togglePass.addEventListener('click', () => {
                const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passInput.setAttribute('type', type);
                togglePass.children[0].textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>

            to {

            animation: fadeInUp 0.6s ease-out forwards;
